<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 3D</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a1a 0%,#141432 50%,#0a0a1a 100%);
            min-height:100vh;display:flex;justify-content:center;align-items:center;
            font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden;
        }
        .particles{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}
        .particles span{
            position:absolute;width:3px;height:3px;background:rgba(83,216,251,0.25);
            border-radius:50%;animation:pfloat linear infinite;
        }
        @keyframes pfloat{
            0%{transform:translateY(100vh) scale(0);opacity:0}
            50%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}
        }
        .wrapper{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px}
        .header h1{
            font-size:2rem;font-weight:800;letter-spacing:6px;
            background:linear-gradient(90deg,#53d8fb,#e94560,#f5c542);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
        .chip{
            display:flex;align-items:center;gap:8px;
            background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
            padding:6px 16px;border-radius:30px;backdrop-filter:blur(8px);
        }
        .chip-label{font-size:0.7rem;color:#666;text-transform:uppercase;letter-spacing:1px}
        .chip-val{font-size:1.2rem;font-weight:700;min-width:30px;text-align:center}
        .chip-val.level{color:#f5c542}.chip-val.score{color:#53d8fb}
        .chip-val.best{color:#e94560}.chip-val.target{color:#6bffb8}
        .goal-bar{
            width:540px;max-width:90vw;height:6px;background:rgba(255,255,255,0.06);
            border-radius:3px;overflow:hidden;
        }
        .goal-fill{
            height:100%;border-radius:3px;transition:width 0.4s ease;
            background:linear-gradient(90deg,#53d8fb,#6bffb8);
        }
        .fs-btn{
            position:absolute;top:10px;right:10px;z-index:10;
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            border-radius:8px;color:#888;font-size:1.1rem;cursor:pointer;
            width:36px;height:36px;display:flex;align-items:center;justify-content:center;
            transition:all 0.2s;
        }
        .fs-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
        .canvas-box{
            position:relative;border-radius:14px;overflow:hidden;
            box-shadow:8px 8px 30px rgba(0,0,0,0.6),-4px -4px 20px rgba(83,216,251,0.08),
                inset 0 0 80px rgba(0,0,0,0.3);
        }
        canvas{display:block;border-radius:14px}
        .canvas-box:fullscreen,.canvas-box:-webkit-full-screen{
            display:flex;align-items:center;justify-content:center;background:#0a0a1a;border-radius:0;
        }
        .canvas-box:fullscreen canvas,.canvas-box:-webkit-full-screen canvas{
            border-radius:0;width:min(100vw,100vh)!important;height:min(100vw,100vh)!important;
        }
        .canvas-box:fullscreen .overlay,.canvas-box:-webkit-full-screen .overlay{border-radius:0}
        .overlay{
            position:absolute;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.75);display:flex;flex-direction:column;
            justify-content:center;align-items:center;gap:14px;
            border-radius:14px;backdrop-filter:blur(6px);transition:opacity 0.3s;
        }
        .overlay.hidden{opacity:0;pointer-events:none}
        .ov-title{font-size:1.8rem;font-weight:800}
        .ov-title.start{color:#53d8fb}.ov-title.over{color:#e94560}.ov-title.levelup{color:#f5c542}
        .ov-sub{font-size:1rem;color:#888}
        .ov-score{font-size:3.5rem;font-weight:900;color:#53d8fb}
        .ov-goal{font-size:0.9rem;color:#6bffb8;margin-top:4px}
        .btn{
            background:linear-gradient(135deg,#e94560,#c23152);color:#fff;border:none;
            padding:12px 36px;border-radius:30px;font-size:1rem;font-weight:600;
            cursor:pointer;transition:all 0.3s;letter-spacing:1px;
        }
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(233,69,96,0.4)}
        .btn.gold{background:linear-gradient(135deg,#f5c542,#e0a800)}
        .controls{display:flex;gap:20px;color:#444;font-size:0.75rem}
        .controls span{display:flex;align-items:center;gap:4px}
        kbd{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
            border-radius:4px;padding:2px 6px;font-family:monospace;font-size:0.7rem;color:#888;
        }
        .powerups{display:flex;gap:6px;min-height:28px;flex-wrap:wrap;justify-content:center}
        .pu-badge{
            font-size:0.65rem;padding:3px 10px;border-radius:20px;
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            display:none;align-items:center;gap:4px;white-space:nowrap;
        }
        .pu-badge.active{display:flex}
        #rewardCanvas{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;border-radius:14px}
        .mobile{display:none;gap:6px}
        .dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:4px}
        .db{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
            border-radius:10px;color:#aaa;font-size:1.2rem;cursor:pointer;
            display:flex;align-items:center;justify-content:center;user-select:none;
        }
        .db:active{background:rgba(83,216,251,0.2);border-color:#53d8fb;color:#fff}
        .db.empty{background:none;border:none}
        @media(max-width:600px){
            canvas,#rewardCanvas{width:90vw!important;height:90vw!important}
            .mobile{display:flex}.controls{display:none}.goal-bar{width:90vw}
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="wrapper">
    <div class="header"><h1>贪 吃 蛇 3D</h1></div>
    <div class="bar">
        <div class="chip"><span class="chip-label">关卡</span><span class="chip-val level" id="lv">1</span></div>
        <div class="chip"><span class="chip-label">分数</span><span class="chip-val score" id="sc">0</span></div>
        <div class="chip"><span class="chip-label">目标</span><span class="chip-val target" id="tg">10</span></div>
        <div class="chip"><span class="chip-label">最高</span><span class="chip-val best" id="hi">0</span></div>
    </div>
    <div class="goal-bar"><div class="goal-fill" id="gf" style="width:0%"></div></div>

    <div class="canvas-box" id="canvasBox">
        <button class="fs-btn" id="fsBtn" title="全屏">⛶</button>
        <canvas id="cv"></canvas>
        <canvas id="rewardCanvas"></canvas>
        <div class="overlay" id="ovStart">
            <div class="ov-title start">贪吃蛇 3D</div>
            <div class="ov-sub">按方向键 / WASD 开始</div>
            <div class="ov-goal">第 1 关: 吃掉 10 个食物</div>
        </div>
        <div class="overlay hidden" id="ovOver">
            <div class="ov-title over">游戏结束</div>
            <div class="ov-score" id="ovSc">0</div>
            <button class="btn" id="btnRestart">再来一局</button>
        </div>
        <div class="overlay hidden" id="ovLevel">
            <div class="ov-title levelup" id="ovLvTitle">第 2 关</div>
            <div class="ov-sub" id="ovLvGoal">新目标: 吃掉 15 个食物</div>
            <div class="ov-sub" id="ovLvBonus">速度提升!</div>
            <button class="btn gold" id="btnNext">继续挑战</button>
        </div>
    </div>

    <div class="powerups">
        <div class="pu-badge" id="puSlow">🕐 减速</div>
        <div class="pu-badge" id="puShield">🛡️ 护盾</div>
        <div class="pu-badge" id="puDouble">2x 双倍</div>
        <div class="pu-badge" id="puMagnet">🧲 磁铁</div>
        <div class="pu-badge" id="puShrink">✂️ 缩短</div>
        <div class="pu-badge" id="puGhost">👻 穿越</div>
    </div>

    <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span>
    </div>
    <div class="mobile">
        <div class="dpad">
            <div class="db empty"></div>
            <div class="db" data-d="up">▲</div>
            <div class="db empty"></div>
            <div class="db" data-d="left">◀</div>
            <div class="db empty"></div>
            <div class="db" data-d="right">▶</div>
            <div class="db empty"></div>
            <div class="db" data-d="down">▼</div>
            <div class="db empty"></div>
        </div>
    </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);

// === High-DPI canvas setup (1.5K+) ===
const cv=$('cv'),rCv=$('rewardCanvas');
const ctx=cv.getContext('2d'),rCtx=rCv.getContext('2d');
const DISPLAY_SIZE=540;
const DPR=Math.max(window.devicePixelRatio||1,2);
cv.width=DISPLAY_SIZE*DPR;cv.height=DISPLAY_SIZE*DPR;
cv.style.width=DISPLAY_SIZE+'px';cv.style.height=DISPLAY_SIZE+'px';
rCv.width=DISPLAY_SIZE*DPR;rCv.height=DISPLAY_SIZE*DPR;
rCv.style.width=DISPLAY_SIZE+'px';rCv.style.height=DISPLAY_SIZE+'px';
ctx.scale(DPR,DPR);rCtx.scale(DPR,DPR);

const G=20,C=DISPLAY_SIZE/G,R=DISPLAY_SIZE/G;

const LEVELS=[
    {goal:10,speed:180,label:'入门'},{goal:15,speed:165,label:'新手'},
    {goal:20,speed:150,label:'进阶'},{goal:25,speed:138,label:'熟练'},
    {goal:30,speed:126,label:'高手'},{goal:35,speed:116,label:'大师'},
    {goal:40,speed:108,label:'宗师'},{goal:50,speed:100,label:'传说'},
    {goal:60,speed:92,label:'神话'},{goal:99,speed:85,label:'无极'},
];

let snake,food,bonus,dx,dy,ndx,ndy,score,best,level,levelScore,running;
let lastTime=0,accum=0;
// Interpolation: previous positions for smooth movement
let prevSnake=[];
let shieldActive=false,slowActive=false,doubleActive=false,magnetActive=false,ghostActive=false;
let shieldTimer,slowTimer,doubleTimer,magnetTimer;
let rewards=[];

// Particles bg
(()=>{const p=$('particles');for(let i=0;i<25;i++){const s=document.createElement('span');s.style.left=Math.random()*100+'%';s.style.animationDuration=(5+Math.random()*8)+'s';s.style.animationDelay=Math.random()*6+'s';s.style.width=s.style.height=(2+Math.random()*3)+'px';p.appendChild(s)}})();

function getLevel(){return LEVELS[Math.min(level,LEVELS.length-1)]}

function init(){
    snake=[{x:12,y:12}];prevSnake=[{x:12,y:12}];dx=dy=ndx=ndy=0;score=0;level=0;levelScore=0;
    running=false;
    shieldActive=slowActive=doubleActive=magnetActive=ghostActive=false;
    clearTimeout(shieldTimer);clearTimeout(slowTimer);clearTimeout(doubleTimer);clearTimeout(magnetTimer);
    updatePU();
    best=parseInt(localStorage.getItem('snakeBest')||'0');
    $('sc').textContent='0';$('hi').textContent=best;
    updateLevelUI();
    $('ovStart').classList.remove('hidden');
    $('ovOver').classList.add('hidden');
    $('ovLevel').classList.add('hidden');
    rewards=[];clearRewards();
    placeFood();bonus=null;
}

function placeFood(){
    const occ=new Set(snake.map(s=>s.x+','+s.y));
    if(bonus)occ.add(bonus.x+','+bonus.y);
    let p;do{p={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)}}while(occ.has(p.x+','+p.y));
    food=p;
}

function placeBonus(){
    if(bonus)return;
    // 35% chance each time food is eaten
    if(Math.random()>0.35)return;
    const occ=new Set(snake.map(s=>s.x+','+s.y));
    occ.add(food.x+','+food.y);
    let p;do{p={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)}}while(occ.has(p.x+','+p.y));
    const types=['slow','shield','double','magnet','shrink','ghost'];
    bonus={...p,type:types[Math.floor(Math.random()*types.length)],spawn:Date.now()};
}

function activatePowerup(type){
    if(type==='slow'){
        slowActive=true;updatePU();clearTimeout(slowTimer);
        slowTimer=setTimeout(()=>{slowActive=false;updatePU()},8000);
        restartLoop();
    }else if(type==='shield'){
        shieldActive=true;updatePU();clearTimeout(shieldTimer);
        shieldTimer=setTimeout(()=>{shieldActive=false;updatePU()},10000);
    }else if(type==='double'){
        doubleActive=true;updatePU();clearTimeout(doubleTimer);
        doubleTimer=setTimeout(()=>{doubleActive=false;updatePU()},10000);
    }else if(type==='magnet'){
        magnetActive=true;updatePU();clearTimeout(magnetTimer);
        magnetTimer=setTimeout(()=>{magnetActive=false;updatePU()},8000);
    }else if(type==='shrink'){
        // Remove half of snake tail
        const keep=Math.max(2,Math.ceil(snake.length/2));
        snake.length=keep;
    }else if(type==='ghost'){
        ghostActive=true;updatePU();
        setTimeout(()=>{ghostActive=false;updatePU()},6000);
    }
}

function restartLoop(){
    // Speed change takes effect on next frame automatically
}

function updatePU(){
    $('puSlow').classList.toggle('active',slowActive);
    $('puShield').classList.toggle('active',shieldActive);
    $('puDouble').classList.toggle('active',doubleActive);
    $('puMagnet').classList.toggle('active',magnetActive);
    $('puShrink').classList.toggle('active',false); // instant, just flash
    $('puGhost').classList.toggle('active',ghostActive);
}

function updateLevelUI(){
    const lv=getLevel();
    $('lv').textContent=level+1;
    $('tg').textContent=lv.goal;
    $('gf').style.width=Math.min(levelScore/lv.goal*100,100)+'%';
    $('ovLvGoal').textContent='目标: 吃掉 '+lv.goal+' 个食物';
}

// === 3D Drawing ===
function drawFloor(){
    const g=ctx.createLinearGradient(0,0,0,DISPLAY_SIZE);
    g.addColorStop(0,'#0d1b2a');g.addColorStop(1,'#1b2838');
    ctx.fillStyle=g;ctx.fillRect(0,0,DISPLAY_SIZE,DISPLAY_SIZE);
    ctx.strokeStyle='rgba(83,216,251,0.04)';ctx.lineWidth=1;
    for(let i=0;i<=C;i++){ctx.beginPath();ctx.moveTo(i*G,0);ctx.lineTo(i*G,DISPLAY_SIZE);ctx.stroke()}
    for(let i=0;i<=R;i++){ctx.beginPath();ctx.moveTo(0,i*G);ctx.lineTo(DISPLAY_SIZE,i*G);ctx.stroke()}
}

function draw3DRect(x,y,w,h,r,topColor,bottomColor,sideColor){
    const d=3;
    ctx.fillStyle='rgba(0,0,0,0.3)';roundRect(ctx,x+2,y+2,w,h,r);ctx.fill();
    ctx.fillStyle=sideColor;
    ctx.beginPath();ctx.moveTo(x+w,y+d);ctx.lineTo(x+w+d,y+d+d);ctx.lineTo(x+w+d,y+h+d);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x+d,y+h);ctx.lineTo(x+d+d,y+h+d);ctx.lineTo(x+w+d,y+h+d);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    const tg=ctx.createLinearGradient(x,y,x+w,y+h);
    tg.addColorStop(0,topColor);tg.addColorStop(1,bottomColor);
    ctx.fillStyle=tg;roundRect(ctx,x,y,w,h,r);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.08)';roundRect(ctx,x,y,w*0.6,h*0.4,r);ctx.fill();
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawFood3D(){
    const cx=food.x*G+G/2,cy=food.y*G+G/2;
    const pulse=1+Math.sin(Date.now()/200)*0.12;
    // Glow
    const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,G*1.2*pulse);
    gl.addColorStop(0,'rgba(233,69,96,0.3)');gl.addColorStop(1,'rgba(233,69,96,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,G*1.2*pulse,0,Math.PI*2);ctx.fill();
    // Sphere
    const sg=ctx.createRadialGradient(cx-3,cy-4,1,cx,cy,G/2-2);
    sg.addColorStop(0,'#ff8fa3');sg.addColorStop(0.5,'#e94560');sg.addColorStop(1,'#8b1a30');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,(G/2-2)*pulse,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(cx-4,cy-5,3,0,Math.PI*2);ctx.fill();
}

function drawBonus3D(){
    if(!bonus)return;
    const t=(Date.now()-bonus.spawn)/4000;
    if(t>1){bonus=null;return}
    const cx=bonus.x*G+G/2,cy=bonus.y*G+G/2;
    const bob=Math.sin(Date.now()/150)*3;
    const fade=t>0.7?(1-t)/0.3:1;
    const colors={
        slow:['#53d8fb','#1a6b8a'],shield:['#6bffb8','#1a6b4a'],double:['#f5c542','#8a6b1a'],
        magnet:['#e94560','#8a1a30'],shrink:['#c77dff','#6b1a8a'],ghost:['#a0a0ff','#3a3a8a']
    };
    const [c1,c2]=colors[bonus.type]||['#fff','#888'];
    ctx.save();ctx.globalAlpha=fade;
    // Glow
    const gl=ctx.createRadialGradient(cx,cy+bob,0,cx,cy+bob,G);
    gl.addColorStop(0,c1+'4d');gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy+bob,G,0,Math.PI*2);ctx.fill();
    // Diamond
    const s=G/2-3;
    ctx.translate(cx,cy+bob);ctx.rotate(Date.now()/500);
    const dg=ctx.createLinearGradient(-s,0,s,0);dg.addColorStop(0,c1);dg.addColorStop(1,c2);
    ctx.fillStyle=dg;ctx.beginPath();
    ctx.moveTo(0,-s);ctx.lineTo(s,0);ctx.lineTo(0,s);ctx.lineTo(-s,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(-s*0.2,-s*0.2,s*0.25,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Label
    const labels={slow:'🕐',shield:'🛡️',double:'2×',magnet:'🧲',shrink:'✂️',ghost:'👻'};
    ctx.globalAlpha=fade;ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(labels[bonus.type]||'?',cx,cy+bob+G/2+11);
    ctx.globalAlpha=1;
}

function drawSnake3D(t){
    // t = interpolation ratio (0 = at prev position, 1 = at current position)
    for(let i=snake.length-1;i>=0;i--){
        const s=snake[i];
        const p=prevSnake[i]||s;
        const ix=p.x+(s.x-p.x)*t, iy=p.y+(s.y-p.y)*t;
        const x=ix*G,y=iy*G;
        if(i===0){
            // Head shadow
            ctx.fillStyle='rgba(0,0,0,0.3)';roundRect(ctx,x+3,y+3,G-2,G-2,6);ctx.fill();
            // Head
            if(ghostActive){
                ctx.globalAlpha=0.6;
                const hc1='#a0a0ff',hc2='#6060cc',hsc='#3a3a8a';
                draw3DRect(x+1,y+1,G-2,G-2,6,hc1,hc2,hsc);
                ctx.globalAlpha=1;
            }else{
                const hc1='#7aeaff',hc2='#3ab8d9',hsc='#1a7a99';
                draw3DRect(x+1,y+1,G-2,G-2,6,hc1,hc2,hsc);
            }
            // Eyes
            let e1x,e1y,e2x,e2y;
            if(dx===1){e1x=e2x=x+G-7;e1y=y+6;e2y=y+G-6}
            else if(dx===-1){e1x=e2x=x+7;e1y=y+6;e2y=y+G-6}
            else if(dy===-1){e1y=e2y=y+7;e1x=x+6;e2x=x+G-6}
            else{e1y=e2y=y+G-7;e1x=x+6;e2x=x+G-6}
            ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e1x,e1y,3.5,0,Math.PI*2);ctx.arc(e2x,e2y,3.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(e1x,e1y,1.8,0,Math.PI*2);ctx.arc(e2x,e2y,1.8,0,Math.PI*2);ctx.fill();
            // Shield aura
            if(shieldActive){
                ctx.strokeStyle='rgba(107,255,184,0.5)';ctx.lineWidth=2.5;
                ctx.beginPath();ctx.arc(x+G/2,y+G/2,G/2+5,0,Math.PI*2);ctx.stroke();
            }
            // Magnet indicator
            if(magnetActive){
                ctx.strokeStyle='rgba(233,69,96,0.3)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
                ctx.beginPath();ctx.arc(x+G/2,y+G/2,G*2,0,Math.PI*2);ctx.stroke();
                ctx.setLineDash([]);
            }
        }else{
            const t=i/snake.length;
            let r=Math.round(60-t*25),g=Math.round(200-t*80),b=Math.round(230-t*60);
            if(ghostActive){r=Math.round(r*0.6+100);g=Math.round(g*0.6+100);b=Math.min(255,b+60)}
            const top=`rgb(${r+30},${g+20},${b+15})`;
            const bot=`rgb(${r},${g},${b})`;
            const side=`rgb(${Math.max(r-30,0)},${Math.max(g-30,0)},${Math.max(b-30,0)})`;
            if(ghostActive)ctx.globalAlpha=0.45;
            draw3DRect(x+2,y+2,G-4,G-4,5,top,bot,side);
            if(ghostActive)ctx.globalAlpha=1;
        }
    }
}

function draw(t){drawFloor();drawFood3D();drawBonus3D();drawSnake3D(t||1)}

function update(){
    // Save previous positions for interpolation
    prevSnake=snake.map(s=>({x:s.x,y:s.y}));
    dx=ndx;dy=ndy;

    // Magnet: pull food closer
    if(magnetActive){
        const head=snake[0];
        const dist=Math.abs(food.x-head.x)+Math.abs(food.y-head.y);
        if(dist>1&&dist<6){
            if(food.x>head.x)food.x--;
            else if(food.x<head.x)food.x++;
            if(food.y>head.y)food.y--;
            else if(food.y<head.y)food.y++;
        }
    }

    const head={x:snake[0].x+dx,y:snake[0].y+dy};

    // Wall
    if(head.x<0||head.x>=C||head.y<0||head.y>=R){
        if(shieldActive){shieldActive=false;updatePU();ndx=-ndx;ndy=-ndy;return}
        return endGame();
    }
    // Self collision (skip if ghost)
    if(!ghostActive){
        for(let i=0;i<snake.length;i++){
            if(snake[i].x===head.x&&snake[i].y===head.y){
                if(shieldActive){shieldActive=false;updatePU();return}
                return endGame();
            }
        }
    }

    snake.unshift(head);
    let ate=false;

    // Eat food
    if(head.x===food.x&&head.y===food.y){
        const pts=doubleActive?2:1;
        score+=pts;levelScore+=pts;
        $('sc').textContent=score;
        if(score>best){best=score;$('hi').textContent=best;localStorage.setItem('snakeBest',best)}
        spawnReward(food.x,food.y,'#ff6b81','+'+pts);
        ate=true;placeFood();placeBonus();updateLevelUI();
        if(levelScore>=getLevel().goal&&level<LEVELS.length-1){levelUp();return}
    }

    // Eat bonus
    if(bonus&&head.x===bonus.x&&head.y===bonus.y){
        const labels={slow:'🕐 减速!',shield:'🛡️ 护盾!',double:'2× 双倍!',magnet:'🧲 磁铁!',shrink:'✂️ 缩短!',ghost:'👻 穿越!'};
        const colors={slow:'#53d8fb',shield:'#6bffb8',double:'#f5c542',magnet:'#e94560',shrink:'#c77dff',ghost:'#a0a0ff'};
        spawnReward(bonus.x,bonus.y,colors[bonus.type]||'#fff',labels[bonus.type]||'奖励!');
        activatePowerup(bonus.type);
        bonus=null;ate=true;
    }

    if(!ate)snake.pop();
}

function levelUp(){
    running=false;
    const nxt=getLevel();
    $('ovLvTitle').textContent='第 '+(level+2)+' 关';
    $('ovLvGoal').textContent='目标: 吃掉 '+nxt.goal+' 个食物';
    $('ovLvBonus').textContent='速度提升! - '+nxt.label;
    $('ovLevel').classList.remove('hidden');
}

function nextLevel(){
    level++;levelScore=0;$('ovLevel').classList.add('hidden');
    updateLevelUI();running=true;accum=0;lastTime=0;
    prevSnake=snake.map(s=>({x:s.x,y:s.y}));
}

function endGame(){
    running=false;
    $('ovSc').textContent=score;$('ovOver').classList.remove('hidden');
}

function setDir(x,y){
    if(snake.length>1&&dx===-x&&dy===-y)return;
    ndx=x;ndy=y;
}

function startGame(x,y){
    if(running){setDir(x,y);return}
    ndx=x;ndy=y;dx=x;dy=y;running=true;accum=0;lastTime=0;
    prevSnake=snake.map(s=>({x:s.x,y:s.y}));
    $('ovStart').classList.add('hidden');$('ovOver').classList.add('hidden');$('ovLevel').classList.add('hidden');
}

// Controls
document.addEventListener('keydown',e=>{
    const k=e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D'].includes(k))e.preventDefault();
    switch(k){
        case'ArrowUp':case'w':case'W':startGame(0,-1);break;
        case'ArrowDown':case's':case'S':startGame(0,1);break;
        case'ArrowLeft':case'a':case'A':startGame(-1,0);break;
        case'ArrowRight':case'd':case'D':startGame(1,0);break;
    }
});
document.querySelectorAll('[data-d]').forEach(b=>{
    b.addEventListener('touchstart',e=>{
        e.preventDefault();const d=b.dataset.d;
        if(d==='up')startGame(0,-1);else if(d==='down')startGame(0,1);
        else if(d==='left')startGame(-1,0);else if(d==='right')startGame(1,0);
    });
});

$('btnRestart').addEventListener('click',init);
$('btnNext').addEventListener('click',nextLevel);

// Fullscreen
$('fsBtn').addEventListener('click',()=>{
    const box=$('canvasBox');
    if(!document.fullscreenElement&&!document.webkitFullscreenElement)
        (box.requestFullscreen||box.webkitRequestFullscreen).call(box);
    else (document.exitFullscreen||document.webkitExitFullscreen).call(document);
});
document.addEventListener('fullscreenchange',()=>{$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶'});
document.addEventListener('webkitfullscreenchange',()=>{$('fsBtn').textContent=document.webkitFullscreenElement?'✕':'⛶'});

// === Unified 60fps+ game loop ===
function getSpeed(){
    let s=getLevel().speed;
    if(slowActive)s=Math.round(s*1.5);
    return s;
}

function gameLoop(now){
    requestAnimationFrame(gameLoop);
    if(!lastTime)lastTime=now;
    const delta=Math.min(now-lastTime,100); // cap to avoid spiral
    lastTime=now;

    // Game logic with time accumulator
    let ratio=1;
    if(running){
        accum+=delta;
        const spd=getSpeed();
        while(accum>=spd){
            accum-=spd;
            update();
            if(!running)break;
        }
        // Interpolation ratio: how far between previous and current position
        ratio=Math.min(accum/spd,1);
    }

    // Render every frame with interpolation for smooth 120fps movement
    draw(ratio);
    updateRewards(now);
}

// Reward system uses real time
function updateRewards(now){
    rCtx.clearRect(0,0,DISPLAY_SIZE,DISPLAY_SIZE);
    rewards=rewards.filter(r=>{
        const elapsed=(now-r.born)/1000;
        const a=1-elapsed/r.dur;
        if(a<=0)return false;
        if(r.type==='text'){
            r.cy+=r.vy*(1/60);
            rCtx.globalAlpha=Math.min(a*2,1);
            rCtx.fillStyle=r.color;
            rCtx.font='bold 18px sans-serif';
            rCtx.textAlign='center';
            rCtx.shadowColor=r.color;rCtx.shadowBlur=8;
            rCtx.fillText(r.text,r.cx,r.cy);
            rCtx.shadowBlur=0;rCtx.globalAlpha=1;
        }else if(r.type==='p'){
            r.cx+=r.vx*(1/60);r.cy+=r.vy*(1/60);r.vy+=4;
            rCtx.globalAlpha=a;
            rCtx.fillStyle=r.color;
            rCtx.shadowColor=r.color;rCtx.shadowBlur=6;
            rCtx.beginPath();rCtx.arc(r.cx,r.cy,r.size*a,0,Math.PI*2);rCtx.fill();
            rCtx.shadowBlur=0;rCtx.globalAlpha=1;
        }else if(r.type==='ring'){
            const t=1-a;
            const radius=r.maxRadius*t+r.minRadius*(1-t);
            rCtx.globalAlpha=a*0.5;
            rCtx.strokeStyle=r.color;rCtx.lineWidth=2.5*a;
            rCtx.beginPath();rCtx.arc(r.cx,r.cy,radius,0,Math.PI*2);rCtx.stroke();
            rCtx.globalAlpha=1;
        }else if(r.type==='spark'){
            r.cx+=r.vx*(1/60);r.cy+=r.vy*(1/60);
            rCtx.globalAlpha=a;
            rCtx.fillStyle='#fff';
            rCtx.shadowColor=r.color;rCtx.shadowBlur=4;
            rCtx.beginPath();rCtx.arc(r.cx,r.cy,r.size*a,0,Math.PI*2);rCtx.fill();
            rCtx.shadowBlur=0;rCtx.globalAlpha=1;
        }
        return true;
    });
}

function clearRewards(){rewards=[];rCtx.clearRect(0,0,DISPLAY_SIZE,DISPLAY_SIZE)}

// Override spawnReward to use time-based system
function spawnReward(x,y,color,text){
    const cx=x*G+G/2,cy=y*G+G/2;
    const now=performance.now();
    if(text)rewards.push({type:'text',cx,cy,text,color,vy:-110,dur:1.2,born:now});
    for(let i=0;i<18;i++){
        const angle=Math.random()*Math.PI*2,speed=90+Math.random()*240;
        rewards.push({type:'p',cx,cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
            color,dur:0.7+Math.random()*0.5,born:now,size:2+Math.random()*4});
    }
    rewards.push({type:'ring',cx,cy,color,dur:0.6,born:now,minRadius:4,maxRadius:35});
    rewards.push({type:'ring',cx,cy,color,dur:0.8,born:now,minRadius:4,maxRadius:50});
    for(let i=0;i<6;i++){
        const angle=Math.random()*Math.PI*2,dist=10+Math.random()*20;
        rewards.push({type:'spark',cx:cx+Math.cos(angle)*dist,cy:cy+Math.sin(angle)*dist,
            color,dur:0.4+Math.random()*0.3,born:now,size:1+Math.random()*2,
            vx:Math.cos(angle)*30,vy:Math.sin(angle)*30});
    }
}

init();
requestAnimationFrame(gameLoop);
})();
</script>
