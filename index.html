<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #0c0c1d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
        }
        .bg-particles span {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(83, 216, 251, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .game-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #53d8fb, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 4px;
        }

        /* Score bar */
        .score-bar {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .stat:hover { border-color: rgba(83, 216, 251, 0.4); }
        .stat-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #53d8fb;
            min-width: 36px;
            text-align: center;
        }
        .stat-value.best { color: #f5c542; }

        /* Canvas container */
        .canvas-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(83, 216, 251, 0.15),
                0 0 80px rgba(233, 69, 96, 0.1),
                inset 0 0 60px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            background: #0f1a2e;
            border-radius: 12px;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .overlay-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e94560;
        }
        .overlay-sub {
            font-size: 1rem;
            color: #aaa;
        }
        .overlay-score {
            font-size: 3rem;
            font-weight: 800;
            color: #53d8fb;
        }
        .btn {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
            border: none;
            padding: 12px 36px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
        }

        /* Controls hint */
        .controls {
            display: flex;
            gap: 20px;
            color: #555;
            font-size: 0.8rem;
        }
        .controls span { display: flex; align-items: center; gap: 4px; }
        kbd {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #aaa;
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            gap: 6px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
        }
        .d-pad-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.15s;
        }
        .d-pad-btn:active {
            background: rgba(83, 216, 251, 0.2);
            border-color: #53d8fb;
            color: #fff;
        }
        .d-pad-btn.empty { background: none; border: none; }

        @media (max-width: 500px) {
            canvas { width: 300px; height: 300px; }
            .mobile-controls { display: flex; }
            .controls { display: none; }
            .header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="bg-particles" id="particles"></div>

<div class="game-wrapper">
    <div class="header">
        <h1>贪 吃 蛇</h1>
    </div>

    <div class="score-bar">
        <div class="stat">
            <span class="stat-label">分数</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">最高</span>
            <span class="stat-value best" id="best">0</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="overlay" id="startOverlay">
            <div class="overlay-title">贪吃蛇</div>
            <div class="overlay-sub">按任意方向键开始</div>
        </div>

        <div class="overlay hidden" id="gameOverOverlay">
            <div class="overlay-title">游戏结束</div>
            <div class="overlay-score" id="finalScore">0</div>
            <button class="btn" id="restartBtn">再来一局</button>
        </div>
    </div>

    <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
        <span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动</span>
    </div>

    <div class="mobile-controls">
        <div class="d-pad">
            <div class="d-pad-btn empty"></div>
            <div class="d-pad-btn" data-dir="up">▲</div>
            <div class="d-pad-btn empty"></div>
            <div class="d-pad-btn" data-dir="left">◀</div>
            <div class="d-pad-btn empty"></div>
            <div class="d-pad-btn" data-dir="right">▶</div>
            <div class="d-pad-btn empty"></div>
            <div class="d-pad-btn" data-dir="down">▼</div>
            <div class="d-pad-btn empty"></div>
        </div>
    </div>
</div>

<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;
    const SPEED = 120;

    let snake, food, dx, dy, nextDx, nextDy, score, best, loop, running, started;

    // Particles background
    const particles = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const s = document.createElement('span');
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDuration = (4 + Math.random() * 8) + 's';
        s.style.animationDelay = Math.random() * 6 + 's';
        s.style.width = s.style.height = (2 + Math.random() * 3) + 'px';
        particles.appendChild(s);
    }

    function init() {
        snake = [{ x: 10, y: 10 }];
        dx = 0; dy = 0;
        nextDx = 0; nextDy = 0;
        score = 0;
        running = false;
        started = false;
        best = parseInt(localStorage.getItem('snakeBest') || '0');
        scoreEl.textContent = '0';
        bestEl.textContent = best;
        startOverlay.classList.remove('hidden');
        gameOverOverlay.classList.add('hidden');
        placeFood();
        draw();
    }

    function placeFood() {
        const occupied = new Set(snake.map(s => s.x + ',' + s.y));
        let pos;
        do {
            pos = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
        } while (occupied.has(pos.x + ',' + pos.y));
        food = pos;
    }

    function drawGrid() {
        ctx.fillStyle = '#0f1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * GRID, 0);
            ctx.lineTo(i * GRID, canvas.height);
            ctx.stroke();
        }
        for (let i = 0; i <= ROWS; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * GRID);
            ctx.lineTo(canvas.width, i * GRID);
            ctx.stroke();
        }
    }

    function drawFood() {
        const cx = food.x * GRID + GRID / 2;
        const cy = food.y * GRID + GRID / 2;
        const r = GRID / 2 - 3;
        const pulse = 1 + Math.sin(Date.now() / 200) * 0.15;

        // Glow
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5 * pulse);
        glow.addColorStop(0, 'rgba(233, 69, 96, 0.3)');
        glow.addColorStop(1, 'rgba(233, 69, 96, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 2.5 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Apple body
        const grad = ctx.createRadialGradient(cx - 2, cy - 3, 1, cx, cy, r * pulse);
        grad.addColorStop(0, '#ff6b81');
        grad.addColorStop(1, '#e94560');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawSnake() {
        for (let i = snake.length - 1; i >= 0; i--) {
            const seg = snake[i];
            const x = seg.x * GRID;
            const y = seg.y * GRID;
            const isHead = i === 0;

            if (isHead) {
                // Head glow
                const hcx = x + GRID / 2;
                const hcy = y + GRID / 2;
                const hglow = ctx.createRadialGradient(hcx, hcy, 0, hcx, hcy, GRID);
                hglow.addColorStop(0, 'rgba(83, 216, 251, 0.25)');
                hglow.addColorStop(1, 'rgba(83, 216, 251, 0)');
                ctx.fillStyle = hglow;
                ctx.beginPath();
                ctx.arc(hcx, hcy, GRID, 0, Math.PI * 2);
                ctx.fill();

                // Head
                const headGrad = ctx.createLinearGradient(x, y, x + GRID, y + GRID);
                headGrad.addColorStop(0, '#7aeaff');
                headGrad.addColorStop(1, '#53d8fb');
                ctx.fillStyle = headGrad;
                roundRect(ctx, x + 1, y + 1, GRID - 2, GRID - 2, 5);
                ctx.fill();

                // Eyes
                const ed = 4;
                let ex1, ey1, ex2, ey2;
                if (dx === 1) { ex1 = ex2 = x + GRID - 7; ey1 = y + 6; ey2 = y + GRID - 6; }
                else if (dx === -1) { ex1 = ex2 = x + 7; ey1 = y + 6; ey2 = y + GRID - 6; }
                else if (dy === -1) { ey1 = ey2 = y + 7; ex1 = x + 6; ex2 = x + GRID - 6; }
                else { ey1 = ey2 = y + GRID - 7; ex1 = x + 6; ex2 = x + GRID - 6; }
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ex1, ey1, 3.5, 0, Math.PI * 2);
                ctx.arc(ex2, ey2, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0c0c1d';
                ctx.beginPath();
                ctx.arc(ex1, ey1, 1.8, 0, Math.PI * 2);
                ctx.arc(ex2, ey2, 1.8, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Body gradient
                const t = i / snake.length;
                const r = Math.round(83 - t * 40);
                const g = Math.round(216 - t * 100);
                const b = Math.round(251 - t * 80);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                roundRect(ctx, x + 2, y + 2, GRID - 4, GRID - 4, 4);
                ctx.fill();
            }
        }
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function draw() {
        drawGrid();
        drawFood();
        drawSnake();
    }

    function update() {
        // Apply buffered direction
        dx = nextDx;
        dy = nextDy;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Wall collision
        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
            return endGame();
        }
        // Self collision
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return endGame();
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.textContent = score;
            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem('snakeBest', best);
            }
            placeFood();
        } else {
            snake.pop();
        }
        draw();
    }

    function endGame() {
        running = false;
        clearInterval(loop);
        finalScoreEl.textContent = score;
        gameOverOverlay.classList.remove('hidden');
    }

    function setDirection(x, y) {
        // Prevent 180-degree turn
        if (snake.length > 1 && dx === -x && dy === -y) return;
        nextDx = x;
        nextDy = y;
    }

    function startGame(dirX, dirY) {
        if (running) {
            setDirection(dirX, dirY);
            return;
        }
        nextDx = dirX;
        nextDy = dirY;
        dx = dirX;
        dy = dirY;
        running = true;
        started = true;
        startOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        loop = setInterval(update, SPEED);
    }

    // Keyboard
    document.addEventListener('keydown', e => {
        const key = e.key;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D'].includes(key)) {
            e.preventDefault();
        }
        switch (key) {
            case 'ArrowUp':    case 'w': case 'W': startGame(0, -1); break;
            case 'ArrowDown':  case 's': case 'S': startGame(0, 1);  break;
            case 'ArrowLeft':  case 'a': case 'A': startGame(-1, 0); break;
            case 'ArrowRight': case 'd': case 'D': startGame(1, 0);  break;
        }
    });

    // Mobile d-pad
    document.querySelectorAll('.d-pad-btn[data-dir]').forEach(btn => {
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            const dir = btn.dataset.dir;
            if (dir === 'up') startGame(0, -1);
            else if (dir === 'down') startGame(0, 1);
            else if (dir === 'left') startGame(-1, 0);
            else if (dir === 'right') startGame(1, 0);
        });
    });

    // Restart button
    restartBtn.addEventListener('click', init);

    // Food animation loop
    function animate() {
        if (!running) draw();
        requestAnimationFrame(animate);
    }

    init();
    animate();
})();
</script>
</body>
</html>
