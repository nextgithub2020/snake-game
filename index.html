<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 3D</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a1a 0%,#141432 50%,#0a0a1a 100%);
            min-height:100vh;display:flex;justify-content:center;align-items:center;
            font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden;
        }
        .particles{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}
        .particles span{
            position:absolute;width:3px;height:3px;background:rgba(83,216,251,0.25);
            border-radius:50%;animation:pfloat linear infinite;
        }
        @keyframes pfloat{
            0%{transform:translateY(100vh) scale(0);opacity:0}
            50%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}
        }
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

        .wrapper{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px}
        .header h1{
            font-size:2rem;font-weight:800;letter-spacing:6px;
            background:linear-gradient(90deg,#53d8fb,#e94560,#f5c542);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
        .chip{
            display:flex;align-items:center;gap:8px;
            background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
            padding:6px 16px;border-radius:30px;backdrop-filter:blur(8px);
        }
        .chip-label{font-size:0.7rem;color:#666;text-transform:uppercase;letter-spacing:1px}
        .chip-val{font-size:1.2rem;font-weight:700;min-width:30px;text-align:center}
        .chip-val.level{color:#f5c542}.chip-val.score{color:#53d8fb}
        .chip-val.best{color:#e94560}.chip-val.target{color:#6bffb8}
        .goal-bar{width:540px;max-width:90vw;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
        .goal-fill{height:100%;border-radius:3px;transition:width 0.4s ease;background:linear-gradient(90deg,#53d8fb,#6bffb8)}
        .fs-btn{
            position:absolute;top:10px;right:10px;z-index:10;
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            border-radius:8px;color:#888;font-size:1.1rem;cursor:pointer;
            width:36px;height:36px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;
        }
        .fs-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
        .back-btn{
            position:absolute;top:10px;left:10px;z-index:10;
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            border-radius:8px;color:#888;font-size:0.8rem;cursor:pointer;
            padding:6px 12px;display:flex;align-items:center;gap:4px;transition:all 0.2s;
        }
        .back-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
        .canvas-box{
            position:relative;border-radius:14px;overflow:hidden;
            box-shadow:8px 8px 30px rgba(0,0,0,0.6),-4px -4px 20px rgba(83,216,251,0.08),inset 0 0 80px rgba(0,0,0,0.3);
        }
        canvas{display:block;border-radius:14px}
        .canvas-box:fullscreen,.canvas-box:-webkit-full-screen{display:flex;align-items:center;justify-content:center;background:#0a0a1a;border-radius:0}
        .canvas-box:fullscreen canvas,.canvas-box:-webkit-full-screen canvas{border-radius:0;width:min(100vw,100vh)!important;height:min(100vw,100vh)!important}
        .canvas-box:fullscreen .overlay,.canvas-box:-webkit-full-screen .overlay{border-radius:0}

        /* Overlays */
        .overlay{
            position:absolute;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.8);display:flex;flex-direction:column;
            justify-content:center;align-items:center;gap:14px;
            border-radius:14px;backdrop-filter:blur(8px);transition:opacity 0.3s;
        }
        .overlay.hidden{opacity:0;pointer-events:none}
        .ov-title{font-size:1.8rem;font-weight:800}
        .ov-title.start{color:#53d8fb}.ov-title.over{color:#e94560}.ov-title.levelup{color:#f5c542}
        .ov-sub{font-size:1rem;color:#888}
        .ov-score{font-size:3.5rem;font-weight:900;color:#53d8fb}
        .ov-goal{font-size:0.9rem;color:#6bffb8;margin-top:4px}
        .btn{
            background:linear-gradient(135deg,#e94560,#c23152);color:#fff;border:none;
            padding:12px 36px;border-radius:30px;font-size:1rem;font-weight:600;
            cursor:pointer;transition:all 0.3s;letter-spacing:1px;
        }
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(233,69,96,0.4)}
        .btn.gold{background:linear-gradient(135deg,#f5c542,#e0a800)}
        .btn.ghost{
            background:transparent;border:1px solid rgba(255,255,255,0.2);color:#aaa;
        }
        .btn.ghost:hover{border-color:#53d8fb;color:#53d8fb;box-shadow:0 4px 15px rgba(83,216,251,0.2)}

        /* Main Menu */
        .menu-screen{
            position:absolute;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.85);display:flex;flex-direction:column;
            justify-content:center;align-items:center;gap:20px;
            border-radius:14px;backdrop-filter:blur(10px);transition:opacity 0.3s;
            animation:fadeIn 0.5s ease;
        }
        .menu-screen.hidden{opacity:0;pointer-events:none}
        .menu-title{
            font-size:2.4rem;font-weight:900;letter-spacing:8px;
            background:linear-gradient(90deg,#53d8fb,#e94560,#f5c542);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .menu-subtitle{font-size:0.85rem;color:#555;letter-spacing:2px}
        .menu-btns{display:flex;flex-direction:column;gap:12px;margin-top:10px}
        .menu-btn{
            background:linear-gradient(135deg,rgba(83,216,251,0.15),rgba(83,216,251,0.05));
            border:1px solid rgba(83,216,251,0.25);color:#53d8fb;
            padding:14px 48px;border-radius:30px;font-size:1.1rem;font-weight:600;
            cursor:pointer;transition:all 0.3s;letter-spacing:2px;min-width:220px;text-align:center;
        }
        .menu-btn:hover{
            background:linear-gradient(135deg,rgba(83,216,251,0.25),rgba(83,216,251,0.1));
            border-color:#53d8fb;transform:translateY(-2px);
            box-shadow:0 6px 20px rgba(83,216,251,0.2);
        }
        .menu-btn.active{
            background:linear-gradient(135deg,rgba(233,69,96,0.2),rgba(233,69,96,0.05));
            border-color:rgba(233,69,96,0.4);color:#e94560;
        }

        /* Level Select */
        .level-grid{
            display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
            max-width:400px;width:90%;
        }
        .lv-cell{
            background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;
            transition:all 0.3s;position:relative;overflow:hidden;
        }
        .lv-cell:hover{border-color:#53d8fb;background:rgba(83,216,251,0.08);transform:translateY(-2px)}
        .lv-cell.locked{opacity:0.35;cursor:not-allowed}
        .lv-cell.locked:hover{transform:none;border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.04)}
        .lv-cell.current{border-color:#f5c542;background:rgba(245,197,66,0.1);animation:pulse 2s infinite}
        .lv-num{font-size:1.4rem;font-weight:800;color:#53d8fb}
        .lv-cell.locked .lv-num{color:#444}
        .lv-cell.current .lv-num{color:#f5c542}
        .lv-name{font-size:0.65rem;color:#666;margin-top:2px}
        .lv-cell.locked .lv-name{color:#333}
        .lv-cell.current .lv-name{color:#c9a43a}
        .lv-lock{font-size:1.2rem;color:#333;margin-bottom:2px}

        /* Settings */
        .settings-list{display:flex;flex-direction:column;gap:14px;width:80%;max-width:360px}
        .setting-row{
            display:flex;justify-content:space-between;align-items:center;
            padding:10px 16px;background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.06);border-radius:12px;
        }
        .setting-label{font-size:0.9rem;color:#aaa}
        .setting-desc{font-size:0.65rem;color:#555;margin-top:2px}
        /* Toggle switch */
        .toggle{position:relative;width:44px;height:24px;cursor:pointer}
        .toggle input{display:none}
        .toggle .slider{
            position:absolute;top:0;left:0;right:0;bottom:0;
            background:rgba(255,255,255,0.1);border-radius:12px;transition:all 0.3s;
        }
        .toggle .slider::before{
            content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
            background:#555;border-radius:50%;transition:all 0.3s;
        }
        .toggle input:checked+.slider{background:linear-gradient(135deg,#53d8fb,#3ab8d9)}
        .toggle input:checked+.slider::before{transform:translateX(20px);background:#fff}
        /* Range slider */
        .range-wrap{display:flex;align-items:center;gap:10px}
        .range-wrap input[type=range]{
            -webkit-appearance:none;width:100px;height:4px;
            background:rgba(255,255,255,0.1);border-radius:2px;outline:none;
        }
        .range-wrap input[type=range]::-webkit-slider-thumb{
            -webkit-appearance:none;width:16px;height:16px;
            background:#53d8fb;border-radius:50%;cursor:pointer;
        }
        .range-val{font-size:0.85rem;color:#53d8fb;min-width:28px;text-align:right}

        .controls{display:flex;gap:20px;color:#444;font-size:0.75rem}
        .controls span{display:flex;align-items:center;gap:4px}
        kbd{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
            border-radius:4px;padding:2px 6px;font-family:monospace;font-size:0.7rem;color:#888;
        }
        .powerups{display:flex;gap:6px;min-height:28px;flex-wrap:wrap;justify-content:center}
        .pu-badge{
            font-size:0.65rem;padding:3px 10px;border-radius:20px;
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            display:none;align-items:center;gap:4px;white-space:nowrap;
        }
        .pu-badge.active{display:flex}
        #rewardCanvas{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;border-radius:14px}
        .mobile{display:none;gap:6px}
        .dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:4px}
        .db{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
            border-radius:10px;color:#aaa;font-size:1.2rem;cursor:pointer;
            display:flex;align-items:center;justify-content:center;user-select:none;
        }
        .db:active{background:rgba(83,216,251,0.2);border-color:#53d8fb;color:#fff}
        .db.empty{background:none;border:none}
        @media(max-width:600px){
            canvas,#rewardCanvas{width:90vw!important;height:90vw!important}
            .mobile{display:flex}.controls{display:none}.goal-bar{width:90vw}
            .level-grid{grid-template-columns:repeat(5,1fr);gap:6px}
            .menu-title{font-size:1.6rem;letter-spacing:4px}
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="wrapper">
    <div class="header"><h1>贪 吃 蛇 3D</h1></div>
    <div class="bar">
        <div class="chip"><span class="chip-label">关卡</span><span class="chip-val level" id="lv">1</span></div>
        <div class="chip"><span class="chip-label">分数</span><span class="chip-val score" id="sc">0</span></div>
        <div class="chip"><span class="chip-label">目标</span><span class="chip-val target" id="tg">10</span></div>
        <div class="chip"><span class="chip-label">最高</span><span class="chip-val best" id="hi">0</span></div>
    </div>
    <div class="goal-bar"><div class="goal-fill" id="gf" style="width:0%"></div></div>

    <div class="canvas-box" id="canvasBox">
        <button class="fs-btn" id="fsBtn" title="全屏">⛶</button>
        <button class="back-btn hidden" id="backBtn">← 菜单</button>
        <button class="back-btn hidden" id="pauseBtn" style="left:auto;right:52px">⏸</button>
        <canvas id="cv"></canvas>
        <canvas id="rewardCanvas"></canvas>

        <!-- Main Menu -->
        <div class="menu-screen" id="menuMain">
            <div class="menu-title">贪吃蛇 3D</div>
            <div class="menu-subtitle">SNAKE GAME</div>
            <div class="menu-btns">
                <div class="menu-btn" id="btnPlay">开始游戏</div>
                <div class="menu-btn" id="btnLevels">选择关卡</div>
                <div class="menu-btn" id="btnSettings">游戏设置</div>
            </div>
        </div>

        <!-- Level Select -->
        <div class="menu-screen hidden" id="menuLevels">
            <div class="menu-title" style="font-size:1.6rem">选择关卡</div>
            <div class="level-grid" id="levelGrid"></div>
            <div class="menu-btns" style="margin-top:16px">
                <div class="menu-btn" id="btnLvBack">返回</div>
            </div>
        </div>

        <!-- Settings -->
        <div class="menu-screen hidden" id="menuSettings">
            <div class="menu-title" style="font-size:1.6rem">游戏设置</div>
            <div class="settings-list">
                <div class="setting-row">
                    <div><div class="setting-label">音效</div><div class="setting-desc">吃到食物和道具的音效</div></div>
                    <label class="toggle"><input type="checkbox" id="optSound" checked><span class="slider"></span></label>
                </div>
                <div class="setting-row">
                    <div><div class="setting-label">背景音乐</div><div class="setting-desc">游戏循环背景音乐</div></div>
                    <label class="toggle"><input type="checkbox" id="optMusic" checked><span class="slider"></span></label>
                </div>
                <div class="setting-row">
                    <div><div class="setting-label">背景粒子</div><div class="setting-desc">界面浮动粒子效果</div></div>
                    <label class="toggle"><input type="checkbox" id="optParticles" checked><span class="slider"></span></label>
                </div>
                <div class="setting-row">
                    <div><div class="setting-label">网格线</div><div class="setting-desc">游戏区域网格显示</div></div>
                    <label class="toggle"><input type="checkbox" id="optGrid" checked><span class="slider"></span></label>
                </div>
                <div class="setting-row">
                    <div><div class="setting-label">奖励动画</div><div class="setting-desc">吃到食物的粒子特效</div></div>
                    <label class="toggle"><input type="checkbox" id="optRewards" checked><span class="slider"></span></label>
                </div>
                <div class="setting-row">
                    <div><div class="setting-label">速度倍率</div><div class="setting-desc">调整全局游戏速度</div></div>
                    <div class="range-wrap">
                        <input type="range" id="optSpeed" min="50" max="150" value="100" step="10">
                        <span class="range-val" id="optSpeedVal">1.0x</span>
                    </div>
                </div>
            </div>
            <div class="menu-btns" style="margin-top:16px">
                <div class="menu-btn" id="btnSetBack">返回</div>
            </div>
        </div>

        <!-- In-game overlays -->
        <div class="overlay hidden" id="ovStart">
            <div class="ov-title start" id="ovStartTitle">贪吃蛇 3D</div>
            <div class="ov-sub" id="ovStartSub">按方向键 / WASD 开始</div>
            <div class="ov-goal" id="ovStartGoal"></div>
        </div>
        <div class="overlay hidden" id="ovOver">
            <div class="ov-title over">游戏结束</div>
            <div class="ov-score" id="ovSc">0</div>
            <button class="btn" id="btnRestart">再来一局</button>
            <button class="btn ghost" id="btnOverMenu">返回菜单</button>
        </div>
        <div class="overlay hidden" id="ovLevel">
            <div class="ov-title levelup" id="ovLvTitle">第 2 关</div>
            <div class="ov-sub" id="ovLvGoal">新目标: 吃掉 15 个食物</div>
            <div class="ov-sub" id="ovLvBonus">速度提升!</div>
            <button class="btn gold" id="btnNext">继续挑战</button>
        </div>
        <div class="overlay hidden" id="ovPause">
            <div class="ov-title" style="color:#f5c542">⏸ 已暂停</div>
            <div class="ov-sub">按 空格键 / P 继续</div>
            <button class="btn gold" id="btnResume">继续游戏</button>
            <button class="btn ghost" id="btnPauseMenu">返回菜单</button>
        </div>
    </div>

    <div class="powerups">
        <div class="pu-badge" id="puSlow">🕐 减速</div>
        <div class="pu-badge" id="puShield">🛡️ 护盾</div>
        <div class="pu-badge" id="puDouble">2x 双倍</div>
        <div class="pu-badge" id="puMagnet">🧲 磁铁</div>
        <div class="pu-badge" id="puShrink">✂️ 缩短</div>
        <div class="pu-badge" id="puGhost">👻 穿越</div>
    </div>

    <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span>
    </div>
    <div class="mobile">
        <div class="dpad">
            <div class="db empty"></div><div class="db" data-d="up">▲</div><div class="db empty"></div>
            <div class="db" data-d="left">◀</div><div class="db empty"></div><div class="db" data-d="right">▶</div>
            <div class="db empty"></div><div class="db" data-d="down">▼</div><div class="db empty"></div>
        </div>
    </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);

// === Audio (Web Audio API) ===
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function resumeAudio(){if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,dur,vol=0.15,type='sine',delay=0){
    if(!$('optSound').checked)return;
    const t=audioCtx.currentTime+delay;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur);
}
function playNoise(dur,vol=0.1){
    if(!$('optSound').checked)return;
    const bufSize=audioCtx.sampleRate*dur;
    const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*0.5;
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
    src.buffer=buf;f.type='lowpass';f.frequency.value=2000;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start();src.stop(audioCtx.currentTime+dur);
}
// Eat food: cheerful ascending arpeggio
function sfxEat(){playTone(523,0.08,0.12);playTone(659,0.08,0.12,0.06);playTone(784,0.12,0.15,'sine',0.1)}
// Eat bonus: sparkle chime
function sfxBonus(){playTone(800,0.08,0.1);playTone(1000,0.08,0.1,'sine',0.05);playTone(1200,0.08,0.12,'sine',0.1);playTone(1500,0.15,0.12,'sine',0.15)}
// Die: descending sad tone + noise
function sfxDie(){playTone(400,0.15,0.18,'sawtooth');playTone(300,0.15,0.15,'sawtooth',0.1);playTone(200,0.25,0.15,'sawtooth',0.2);playNoise(0.3,0.08)}
// Level up: fanfare
function sfxLevelUp(){playTone(523,0.12,0.12);playTone(659,0.12,0.12,'sine',0.1);playTone(784,0.12,0.12,'sine',0.2);playTone(1047,0.25,0.18,'sine',0.3)}
// Pause
function sfxPause(){playTone(600,0.08,0.08,'triangle');playTone(400,0.1,0.08,'triangle',0.06)}
// Resume
function sfxResume(){playTone(400,0.08,0.08,'triangle');playTone(600,0.1,0.1,'triangle',0.06)}
// Menu click
function sfxClick(){playTone(800,0.05,0.06,'square')}
// Powerup activate: quick whoosh
function sfxPowerup(){playTone(300,0.06,0.08);playTone(600,0.06,0.1,'sine',0.03);playTone(900,0.1,0.08,'sine',0.06)}

// === Background Music ===
let musicGain=null,musicPlaying=false,musicTimeout=null;
function initMusic(){
    if(musicGain)return;
    musicGain=audioCtx.createGain();
    musicGain.gain.value=0;
    musicGain.connect(audioCtx.destination);
}
function playMusicLoop(){
    if(!$('optMusic').checked||!musicPlaying)return;
    const now=audioCtx.currentTime;
    // Gentle ambient chord progression
    const chords=[
        [261.6,329.6,392.0],  // C major
        [293.7,370.0,440.0],  // D major
        [246.9,311.1,370.0],  // B dim
        [261.6,329.6,392.0],  // C major
        [220.0,277.2,329.6],  // A minor
        [246.9,311.1,370.0],  // B dim
        [196.0,246.9,293.7],  // G major
        [220.0,277.2,329.6],  // A minor
    ];
    const beatDur=0.8;
    chords.forEach((chord,ci)=>{
        chord.forEach(freq=>{
            const o=audioCtx.createOscillator();
            const g=audioCtx.createGain();
            o.type='sine';
            o.frequency.setValueAtTime(freq,now+ci*beatDur);
            g.gain.setValueAtTime(0,now+ci*beatDur);
            g.gain.linearRampToValueAtTime(0.04,now+ci*beatDur+0.15);
            g.gain.linearRampToValueAtTime(0.025,now+ci*beatDur+beatDur*0.6);
            g.gain.linearRampToValueAtTime(0,now+ci*beatDur+beatDur);
            o.connect(g);g.connect(musicGain);
            o.start(now+ci*beatDur);o.stop(now+ci*beatDur+beatDur);
        });
        // Add a soft bass note
        const bass=audioCtx.createOscillator();
        const bg=audioCtx.createGain();
        bass.type='triangle';
        bass.frequency.setValueAtTime(chord[0]/2,now+ci*beatDur);
        bg.gain.setValueAtTime(0,now+ci*beatDur);
        bg.gain.linearRampToValueAtTime(0.06,now+ci*beatDur+0.1);
        bg.gain.linearRampToValueAtTime(0,now+ci*beatDur+beatDur);
        bass.connect(bg);bg.connect(musicGain);
        bass.start(now+ci*beatDur);bass.stop(now+ci*beatDur+beatDur);
    });
    const loopDur=chords.length*beatDur*1000;
    musicTimeout=setTimeout(playMusicLoop,loopDur-200);
}
function startMusic(){
    initMusic();
    if(musicPlaying)return;
    musicPlaying=true;
    musicGain.gain.setValueAtTime(0,audioCtx.currentTime);
    musicGain.gain.linearRampToValueAtTime(1,audioCtx.currentTime+1);
    playMusicLoop();
}
function stopMusic(){
    musicPlaying=false;
    if(musicTimeout){clearTimeout(musicTimeout);musicTimeout=null}
    if(musicGain){
        musicGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);
    }
}

// === 3D Drawing ===
function drawFloor(){
    const g=ctx.createLinearGradient(0,0,0,DISPLAY_SIZE);
    g.addColorStop(0,'#0d1b2a');g.addColorStop(1,'#1b2838');
    ctx.fillStyle=g;ctx.fillRect(0,0,DISPLAY_SIZE,DISPLAY_SIZE);
    if($('optGrid').checked){
        ctx.strokeStyle='rgba(83,216,251,0.04)';ctx.lineWidth=1;
        for(let i=0;i<=C;i++){ctx.beginPath();ctx.moveTo(i*G,0);ctx.lineTo(i*G,DISPLAY_SIZE);ctx.stroke()}
        for(let i=0;i<=R;i++){ctx.beginPath();ctx.moveTo(0,i*G);ctx.lineTo(DISPLAY_SIZE,i*G);ctx.stroke()}
    }
}

function draw3DRect(x,y,w,h,r,topColor,bottomColor,sideColor){
    const d=3;
    ctx.fillStyle='rgba(0,0,0,0.3)';roundRect(ctx,x+2,y+2,w,h,r);ctx.fill();
    ctx.fillStyle=sideColor;
    ctx.beginPath();ctx.moveTo(x+w,y+d);ctx.lineTo(x+w+d,y+d+d);ctx.lineTo(x+w+d,y+h+d);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x+d,y+h);ctx.lineTo(x+d+d,y+h+d);ctx.lineTo(x+w+d,y+h+d);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    const tg=ctx.createLinearGradient(x,y,x+w,y+h);
    tg.addColorStop(0,topColor);tg.addColorStop(1,bottomColor);
    ctx.fillStyle=tg;roundRect(ctx,x,y,w,h,r);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.08)';roundRect(ctx,x,y,w*0.6,h*0.4,r);ctx.fill();
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawFood3D(){
    const cx=food.x*G+G/2,cy=food.y*G+G/2;
    const pulse=1+Math.sin(Date.now()/200)*0.12;
    const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,G*1.2*pulse);
    gl.addColorStop(0,'rgba(233,69,96,0.3)');gl.addColorStop(1,'rgba(233,69,96,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,G*1.2*pulse,0,Math.PI*2);ctx.fill();
    const sg=ctx.createRadialGradient(cx-3,cy-4,1,cx,cy,G/2-2);
    sg.addColorStop(0,'#ff8fa3');sg.addColorStop(0.5,'#e94560');sg.addColorStop(1,'#8b1a30');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,(G/2-2)*pulse,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(cx-4,cy-5,3,0,Math.PI*2);ctx.fill();
}

function drawBonus3D(){
    if(!bonus)return;
    const t=(Date.now()-bonus.spawn)/4000;
    if(t>1){bonus=null;return}
    const cx=bonus.x*G+G/2,cy=bonus.y*G+G/2;
    const bob=Math.sin(Date.now()/150)*3;
    const fade=t>0.7?(1-t)/0.3:1;
    const colors={
        slow:['#53d8fb','#1a6b8a'],shield:['#6bffb8','#1a6b4a'],double:['#f5c542','#8a6b1a'],
        magnet:['#e94560','#8a1a30'],shrink:['#c77dff','#6b1a8a'],ghost:['#a0a0ff','#3a3a8a']
    };
    const [c1,c2]=colors[bonus.type]||['#fff','#888'];
    ctx.save();ctx.globalAlpha=fade;
    const gl=ctx.createRadialGradient(cx,cy+bob,0,cx,cy+bob,G);
    gl.addColorStop(0,c1+'4d');gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy+bob,G,0,Math.PI*2);ctx.fill();
    const s=G/2-3;
    ctx.translate(cx,cy+bob);ctx.rotate(Date.now()/500);
    const dg=ctx.createLinearGradient(-s,0,s,0);dg.addColorStop(0,c1);dg.addColorStop(1,c2);
    ctx.fillStyle=dg;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s,0);ctx.lineTo(0,s);ctx.lineTo(-s,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(-s*0.2,-s*0.2,s*0.25,0,Math.PI*2);ctx.fill();
    ctx.restore();
    const labels={slow:'🕐',shield:'🛡️',double:'2×',magnet:'🧲',shrink:'✂️',ghost:'👻'};
    ctx.globalAlpha=fade;ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(labels[bonus.type]||'?',cx,cy+bob+G/2+11);ctx.globalAlpha=1;
}

function drawSnake3D(t){
    for(let i=snake.length-1;i>=0;i--){
        const s=snake[i];
        const p=prevSnake[i]||s;
        const ix=p.x+(s.x-p.x)*t,iy=p.y+(s.y-p.y)*t;
        const x=ix*G,y=iy*G;
        if(i===0){
            ctx.fillStyle='rgba(0,0,0,0.3)';roundRect(ctx,x+3,y+3,G-2,G-2,6);ctx.fill();
            if(ghostActive){
                ctx.globalAlpha=0.6;draw3DRect(x+1,y+1,G-2,G-2,6,'#a0a0ff','#6060cc','#3a3a8a');ctx.globalAlpha=1;
            }else{draw3DRect(x+1,y+1,G-2,G-2,6,'#7aeaff','#3ab8d9','#1a7a99')}
            let e1x,e1y,e2x,e2y;
            if(dx===1){e1x=e2x=x+G-7;e1y=y+6;e2y=y+G-6}
            else if(dx===-1){e1x=e2x=x+7;e1y=y+6;e2y=y+G-6}
            else if(dy===-1){e1y=e2y=y+7;e1x=x+6;e2x=x+G-6}
            else{e1y=e2y=y+G-7;e1x=x+6;e2x=x+G-6}
            ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e1x,e1y,3.5,0,Math.PI*2);ctx.arc(e2x,e2y,3.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(e1x,e1y,1.8,0,Math.PI*2);ctx.arc(e2x,e2y,1.8,0,Math.PI*2);ctx.fill();
            if(shieldActive){ctx.strokeStyle='rgba(107,255,184,0.5)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x+G/2,y+G/2,G/2+5,0,Math.PI*2);ctx.stroke()}
            if(magnetActive){ctx.strokeStyle='rgba(233,69,96,0.3)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(x+G/2,y+G/2,G*2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
        }else{
            const ti=i/snake.length;
            let r=Math.round(60-ti*25),g=Math.round(200-ti*80),b=Math.round(230-ti*60);
            if(ghostActive){r=Math.round(r*0.6+100);g=Math.round(g*0.6+100);b=Math.min(255,b+60)}
            if(ghostActive)ctx.globalAlpha=0.45;
            draw3DRect(x+2,y+2,G-4,G-4,5,`rgb(${r+30},${g+20},${b+15})`,`rgb(${r},${g},${b})`,`rgb(${Math.max(r-30,0)},${Math.max(g-30,0)},${Math.max(b-30,0)})`);
            if(ghostActive)ctx.globalAlpha=1;
        }
    }
}

function draw(t){drawFloor();drawFood3D();drawBonus3D();drawSnake3D(t||1)}

function update(){
    prevSnake=snake.map(s=>({x:s.x,y:s.y}));
    dx=ndx;dy=ndy;
    if(magnetActive){
        const head=snake[0];const dist=Math.abs(food.x-head.x)+Math.abs(food.y-head.y);
        if(dist>1&&dist<6){
            if(food.x>head.x)food.x--;else if(food.x<head.x)food.x++;
            if(food.y>head.y)food.y--;else if(food.y<head.y)food.y++;
        }
    }
    const head={x:snake[0].x+dx,y:snake[0].y+dy};
    if(head.x<0||head.x>=C||head.y<0||head.y>=R){
        if(shieldActive){shieldActive=false;updatePU();ndx=-ndx;ndy=-ndy;return}
        return endGame();
    }
    if(!ghostActive){
        for(let i=0;i<snake.length;i++){
            if(snake[i].x===head.x&&snake[i].y===head.y){
                if(shieldActive){shieldActive=false;updatePU();return}
                return endGame();
            }
        }
    }
    snake.unshift(head);
    let ate=false;
    if(head.x===food.x&&head.y===food.y){
        const pts=doubleActive?2:1;
        score+=pts;levelScore+=pts;
        $('sc').textContent=score;
        if(score>best){best=score;$('hi').textContent=best;localStorage.setItem('snakeBest',best)}
        sfxEat();spawnReward(food.x,food.y,'#ff6b81','+'+pts);
        ate=true;placeFood();placeBonus();updateLevelUI();
        if(levelScore>=getLevel().goal&&level<LEVELS.length-1){levelUp();return}
    }
    if(bonus&&head.x===bonus.x&&head.y===bonus.y){
        const labels={slow:'🕐 减速!',shield:'🛡️ 护盾!',double:'2× 双倍!',magnet:'🧲 磁铁!',shrink:'✂️ 缩短!',ghost:'👻 穿越!'};
        const colors={slow:'#53d8fb',shield:'#6bffb8',double:'#f5c542',magnet:'#e94560',shrink:'#c77dff',ghost:'#a0a0ff'};
        sfxBonus();spawnReward(bonus.x,bonus.y,colors[bonus.type]||'#fff',labels[bonus.type]||'奖励!');
        activatePowerup(bonus.type);bonus=null;ate=true;
    }
    if(!ate)snake.pop();
}

function levelUp(){
    running=false;sfxLevelUp();
    if(level+1>unlockedLevel){unlockedLevel=level+1;localStorage.setItem('snakeUnlocked',unlockedLevel)}
    const nxt=getLevel();
    $('ovLvTitle').textContent='第 '+(level+2)+' 关';
    $('ovLvGoal').textContent='目标: 吃掉 '+nxt.goal+' 个食物';
    $('ovLvBonus').textContent='速度提升! - '+nxt.label;
    showScreen('ovLevel');
}

function nextLevel(){
    level++;levelScore=0;
    updateLevelUI();running=true;accum=0;lastTime=0;
    prevSnake=snake.map(s=>({x:s.x,y:s.y}));

    if(musicGain&&$('optMusic').checked)musicGain.gain.linearRampToValueAtTime(1,audioCtx.currentTime+0.3);
}

function endGame(){

    showScreen('ovOver');
}

function setDir(x,y){
    if(snake.length>1&&dx===-x&&dy===-y)return;
    ndx=x;ndy=y;
}

function startGame(x,y){
    if(paused){resumeGame();return}
    if(running){setDir(x,y);return}
    resumeAudio();ndx=x;ndy=y;dx=x;dy=y;running=true;accum=0;lastTime=0;
    prevSnake=snake.map(s=>({x:s.x,y:s.y}));
    $('ovStart').classList.add('hidden');$('backBtn').classList.remove('hidden');
    $('pauseBtn').classList.remove('hidden');
    startMusic();
}

function pauseGame(){
    if(!running||paused)return;
    paused=true;sfxPause();
    if(musicGain)musicGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.3);
    showScreen('ovPause');
}

function hideAllOverlays(){
    ['menuMain','menuLevels','menuSettings','ovStart','ovOver','ovLevel','ovPause'].forEach(id=>{
        $(id).classList.add('hidden');
    });
}

function resumeGame(){
    if(!paused)return;
    paused=false;lastTime=0;sfxResume();
    hideAllOverlays();
    $('backBtn').classList.remove('hidden');
    $('pauseBtn').classList.remove('hidden');
    document.querySelector('.bar').style.display='';
    document.querySelector('.goal-bar').style.display='';
    document.querySelector('.powerups').style.display='';
    if(musicGain&&$('optMusic').checked)musicGain.gain.linearRampToValueAtTime(1,audioCtx.currentTime+0.3);
}

// Controls
document.addEventListener('keydown',e=>{
    const k=e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D','Escape',' ','p','P'].includes(k))e.preventDefault();
    // Pause/resume
    if((k===' '||k==='p'||k==='P')&&!['menuMain','menuLevels','menuSettings'].includes(getCurrentScreen())){
        if(paused)resumeGame();else if(running)pauseGame();
        return;
    }
    switch(k){
        case'ArrowUp':case'w':case'W':startGame(0,-1);break;
        case'ArrowDown':case's':case'S':startGame(0,1);break;
        case'ArrowLeft':case'a':case'A':startGame(-1,0);break;
        case'ArrowRight':case'd':case'D':startGame(1,0);break;
        case'Escape':if(running){running=false;paused=false;stopMusic();showScreen('menuMain')}break;
    }
});

function getCurrentScreen(){
    const ids=['menuMain','menuLevels','menuSettings','ovStart','ovOver','ovLevel','ovPause'];
    for(const id of ids)if(!$(id).classList.contains('hidden'))return id;
    return '';
}
document.querySelectorAll('[data-d]').forEach(b=>{
    b.addEventListener('touchstart',e=>{
        e.preventDefault();const d=b.dataset.d;
        if(d==='up')startGame(0,-1);else if(d==='down')startGame(0,1);
        else if(d==='left')startGame(-1,0);else if(d==='right')startGame(1,0);
    });
});

$('btnRestart').addEventListener('click',()=>{sfxClick();startFromLevel(level)});
$('btnNext').addEventListener('click',()=>{sfxClick();nextLevel()});
$('pauseBtn').addEventListener('click',pauseGame);
$('btnResume').addEventListener('click',resumeGame);
$('btnPauseMenu').addEventListener('click',()=>{sfxClick();running=false;paused=false;stopMusic();showScreen('menuMain')});

// Fullscreen
$('fsBtn').addEventListener('click',()=>{
    const box=$('canvasBox');
    if(!document.fullscreenElement&&!document.webkitFullscreenElement)
        (box.requestFullscreen||box.webkitRequestFullscreen).call(box);
    else (document.exitFullscreen||document.webkitExitFullscreen).call(document);
});
document.addEventListener('fullscreenchange',()=>{$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶'});
document.addEventListener('webkitfullscreenchange',()=>{$('fsBtn').textContent=document.webkitFullscreenElement?'✕':'⛶'});

// === Game Loop ===
function getSpeed(){
    let s=getLevel().speed;
    if(slowActive)s=Math.round(s*1.5);
    return Math.round(s/getSpeedMul());
}

function gameLoop(now){
    requestAnimationFrame(gameLoop);
    if(!lastTime)lastTime=now;
    const delta=Math.min(now-lastTime,100);lastTime=now;
    let ratio=1;
    if(running&&!paused){
        accum+=delta;const spd=getSpeed();
        while(accum>=spd){accum-=spd;update();if(!running)break}
        ratio=Math.min(accum/spd,1);
    }
    draw(ratio);updateRewards(now);
}

function updateRewards(now){
    rCtx.clearRect(0,0,DISPLAY_SIZE,DISPLAY_SIZE);
    if(!$('optRewards').checked)return;
    rewards=rewards.filter(r=>{
        const elapsed=(now-r.born)/1000;const a=1-elapsed/r.dur;
        if(a<=0)return false;
        if(r.type==='text'){r.cy+=r.vy*(1/60);rCtx.globalAlpha=Math.min(a*2,1);rCtx.fillStyle=r.color;rCtx.font='bold 18px sans-serif';rCtx.textAlign='center';rCtx.shadowColor=r.color;rCtx.shadowBlur=8;rCtx.fillText(r.text,r.cx,r.cy);rCtx.shadowBlur=0;rCtx.globalAlpha=1}
        else if(r.type==='p'){r.cx+=r.vx*(1/60);r.cy+=r.vy*(1/60);r.vy+=4;rCtx.globalAlpha=a;rCtx.fillStyle=r.color;rCtx.shadowColor=r.color;rCtx.shadowBlur=6;rCtx.beginPath();rCtx.arc(r.cx,r.cy,r.size*a,0,Math.PI*2);rCtx.fill();rCtx.shadowBlur=0;rCtx.globalAlpha=1}
        else if(r.type==='ring'){const t=1-a;const radius=r.maxRadius*t+r.minRadius*(1-t);rCtx.globalAlpha=a*0.5;rCtx.strokeStyle=r.color;rCtx.lineWidth=2.5*a;rCtx.beginPath();rCtx.arc(r.cx,r.cy,radius,0,Math.PI*2);rCtx.stroke();rCtx.globalAlpha=1}
        else if(r.type==='spark'){r.cx+=r.vx*(1/60);r.cy+=r.vy*(1/60);rCtx.globalAlpha=a;rCtx.fillStyle='#fff';rCtx.shadowColor=r.color;rCtx.shadowBlur=4;rCtx.beginPath();rCtx.arc(r.cx,r.cy,r.size*a,0,Math.PI*2);rCtx.fill();rCtx.shadowBlur=0;rCtx.globalAlpha=1}
        return true;
    });
}

function clearRewards(){rewards=[];rCtx.clearRect(0,0,DISPLAY_SIZE,DISPLAY_SIZE)}

function spawnReward(x,y,color,text){
    const cx=x*G+G/2,cy=y*G+G/2;const now=performance.now();
    if(text)rewards.push({type:'text',cx,cy,text,color,vy:-110,dur:1.2,born:now});
    for(let i=0;i<18;i++){const angle=Math.random()*Math.PI*2,speed=90+Math.random()*240;rewards.push({type:'p',cx,cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color,dur:0.7+Math.random()*0.5,born:now,size:2+Math.random()*4})}
    rewards.push({type:'ring',cx,cy,color,dur:0.6,born:now,minRadius:4,maxRadius:35});
    rewards.push({type:'ring',cx,cy,color,dur:0.8,born:now,minRadius:4,maxRadius:50});
    for(let i=0;i<6;i++){const angle=Math.random()*Math.PI*2,dist=10+Math.random()*20;rewards.push({type:'spark',cx:cx+Math.cos(angle)*dist,cy:cy+Math.sin(angle)*dist,color,dur:0.4+Math.random()*0.3,born:now,size:1+Math.random()*2,vx:Math.cos(angle)*30,vy:Math.sin(angle)*30})}
}

init();
requestAnimationFrame(gameLoop);
})();
</script>
